name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # The CKAN version tag of the Solr and Postgres containers should match
      # the one of the container the tests run on.
      # You can switch this base image with a custom image tailored to your project
      image: ckan/ckan-dev:2.12
    services:
      solr:
        image: ckan/ckan-solr:2.12-solr9
      postgres:
        image: ckan/ckan-postgres-dev:2.12
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
          image: redis:3
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

      CKAN_FILE_KEEPER_TEST_MINIO_ENDPOINT: "http://127.0.0.1:9000"
      CKAN_FILE_KEEPER_TEST_MINIO_KEY: "minioadmin"
      CKAN_FILE_KEEPER_TEST_MINIO_SECRET: "minioadmin"
      CKAN_FILE_KEEPER_TEST_MINIO_BUCKET: "file-keeper"

      CKAN_FILE_KEEPER_TEST_AZURITE_ACCOUNT_URL: "http://127.0.0.1:10000/{account_name}"
      CKAN_FILE_KEEPER_TEST_AZURITE_ACCOUNT_NAME: "devstoreaccount1"
      CKAN_FILE_KEEPER_TEST_AZURITE_ACCOUNT_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
      CKAN_FILE_KEEPER_TEST_AZURITE_CONTAINER_NAME: "file-keeper"

      CKAN_FILE_KEEPER_TEST_GCS_ENDPOINT: "http://127.0.0.1:4443"

    steps:
      - uses: actions/checkout@v6
        - name: Start GCS
          uses: fsouza/fake-gcs-action@v0.4.2
          with:
            version: "1.52.2"
            scheme: http

        - name: Start MinIO
          uses: infleet/minio-action@v0.0.2
          with:
            port: "9000"
            version: "latest"
            username: "minioadmin"
            password: "minioadmin"

      - name: Install requirements
        # Install any extra requirements your extension has here (dev requirements, other extensions etc)
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install -e .
      - name: Setup extension
        # Extra initialization steps
        run: |
          # Replace default path to CKAN core config file with the one on the container
          sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini

          ckan -c test.ini db init
      - name: Run tests
        run: pytest --ckan-ini=test.ini --cov=ckanext.file_keeper_cloud --disable-warnings ckanext/file_keeper_cloud

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
